<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
<style>
    body {
        font-family: "Times New Roman", Times, serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        padding: 40px 10px;
    }

    .form-wrapper {
        width: 600px;
        max-width: 100%;
    }

    h1 {
        text-align: center;
        font-size: 22px;
        margin-bottom: 15px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
    }

    caption {
        border: 1px solid #999;
        border-bottom: none;
        padding: 6px;
        font-weight: bold;
        background: #fafafa;
    }

    td, th {
        border: 1px solid #999;
        padding: 10px;
        vertical-align: middle;
    }

    td.label {
        width: 35%;
        white-space: nowrap;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
        width: 100%;
        padding: 5px 6px;
        border: 1px solid #999;
        border-radius: 3px;
        font-family: inherit;
        font-size: 14px;
        box-sizing: border-box;
    }

    textarea {
        resize: vertical;
        min-height: 60px;
    }

    .radio-group label,
    .checkbox-group label {
        margin-right: 15px;
        white-space: nowrap;
    }

    .radio-group input,
    .checkbox-group input {
        margin-right: 4px;
    }

    .buttons {
        text-align: center;
        padding: 12px;
    }

    button {
        font-family: inherit;
        font-size: 14px;
        padding: 5px 16px;
        margin: 0 5px;
        border: 1px solid #999;
        border-radius: 3px;
        background: #f0f0f0;
        cursor: pointer;
    }

    button:hover {
        background: #e2e2e2;
    }
</style>
</head>
<body>

<div class="form-wrapper">
    <h1>Student Registration Form</h1>

    <form action="#" method="post">
        <table>
            <caption>Registration Form</caption>
            <tr>
                <td class="label"><label for="name">Full Name</label></td>
                <td><input id="name" name="name" type="text" placeholder="Enter your name"></td>
            </tr>
            <tr>
                <td class="label"><label for="email">Email</label></td>
                <td><input id="email" name="email" type="email" placeholder="abc@gmail.com"></td>
            </tr>
            <tr>
                <td class="label"><label for="phone">Phone Number</label></td>
                <td><input id="phone" name="phone" type="tel" placeholder="9876543210"></td>
            </tr>
            <tr>
                <td class="label"><label for="dob">Date of Birth</label></td>
                <td><input id="dob" name="dob" type="date"></td>
            </tr>
            <tr>
                <td class="label">Gender</td>
                <td class="radio-group">
                    <input id="male" type="radio" name="gender" value="male">
                    <label for="male">Male</label>
                    <input id="female" type="radio" name="gender" value="female">
                    <label for="female">Female</label>
                    <input id="other" type="radio" name="gender" value="other">
                    <label for="other">Other</label>
                </td>
            </tr>
            <tr>
                <td class="label">Skills</td>
                <td class="checkbox-group">
                    <input id="skill-html" type="checkbox" name="skills" value="HTML">
                    <label for="skill-html">HTML</label>
                    <input id="skill-css" type="checkbox" name="skills" value="CSS">
                    <label for="skill-css">CSS</label>
                    <input id="skill-js" type="checkbox" name="skills" value="JavaScript">
                    <label for="skill-js">JavaScript</label>
                </td>
            </tr>
            <tr>
                <td class="label"><label for="course">Course</label></td>
                <td>
                    <select id="course" name="course">
                        <option value="" selected>--Select Course--</option>
                        <option value="BCA">BCA</option>
                        <option value="BTech">B.Tech</option>
                        <option value="MCA">MCA</option>
                        <option value="Other">Other</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label"><label for="address">Address</label></td>
                <td><textarea id="address" name="address"></textarea></td>
            </tr>
            <tr>
                <td class="label"><label for="resume">Upload Resume</label></td>
                <td><input id="resume" name="resume" type="file"></td>
            </tr>
            <tr>
                <td colspan="2" class="buttons">
                    <button type="submit">Register</button>
                    <button type="reset">Reset</button>
                </td>
            </tr>
        </table>
    </form>
</div>

</body>
</html>
