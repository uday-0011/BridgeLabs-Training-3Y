<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Object Updater</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; } input { width: 100%; box-sizing: border-box; padding: .6rem; }
    pre { background: #f3f3f3; padding: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Edit User</h1>
  <form id="userForm">
    <label for="name">Name</label><input id="name" name="name" required>
    <label for="email">Email</label><input id="email" name="email" type="email" required>
    <label for="age">Age</label><input id="age" name="age" type="number" min="0" required>
    <button type="submit">Update user</button>
  </form>
  <h2>Updated object</h2><pre id="userOutput"></pre>
  <script src="q8_dynamic_object_updater.js"></script>
</body>
</html>
