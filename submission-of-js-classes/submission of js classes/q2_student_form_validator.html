<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Form Validator</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; }
    input { box-sizing: border-box; width: 100%; padding: .65rem; border: 2px solid #aaa; border-radius: 5px; }
    input.valid { border-color: green; } input.invalid { border-color: red; }
    .error { color: red; min-height: 1.1em; font-size: .9rem; }
    #result { color: green; }
  </style>
</head>
<body>
  <h1>Student Registration</h1>
  <form id="studentForm" novalidate>
    <label for="name">Name</label><input id="name" name="name" type="text">
    <div class="error" id="nameError"></div>
    <label for="email">Email</label><input id="email" name="email" type="email">
    <div class="error" id="emailError"></div>
    <label for="phone">Phone (10 digits)</label><input id="phone" name="phone" type="tel">
    <div class="error" id="phoneError"></div>
    <label for="password">Password</label><input id="password" name="password" type="password">
    <div class="error" id="passwordError"></div>
    <button type="submit">Register</button>
    <p id="result" aria-live="polite"></p>
  </form>
  <script src="q2_student_form_validator.js"></script>
</body>
</html>
