<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Product List Manager</title>
    <link rel="stylesheet" href="q1_dynamic_product_list.css">
</head>
<body>

        <h1>Product List Manager</h1>

    </main>
    <script src="q1_dynamic_product_list.js"></script>
</body>
</html>
