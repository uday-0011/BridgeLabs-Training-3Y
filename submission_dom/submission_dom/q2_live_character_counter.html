<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Character Counter</title>
    <link rel="stylesheet" href="q2_live_character_counter.css">
</head>
<body>
    <main class="container">
        <h1>Character Counter</h1>
        <textarea id="messageInput" maxlength="100" placeholder="Write up to 100 characters"></textarea>
        <p id="counter" class="normal">100 characters remaining</p>
        <button id="resetButton" type="button">Reset</button>
    </main>
    <script src="q2_live_character_counter.js"></script>
</body>
</html>
