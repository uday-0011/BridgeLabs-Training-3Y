<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="q5_image_gallery.css">
</head>
<body>
    <main class="container">
        <h1>Image Gallery</h1>
        <div id="gallery" class="gallery">
            <img src="https://picsum.photos/id/1015/300/200" alt="Mountain river">
            <img src="https://picsum.photos/id/1025/300/200" alt="Dog portrait">
            <img src="https://picsum.photos/id/1035/300/200" alt="Forest landscape">
            <img src="https://picsum.photos/id/1043/300/200" alt="Mountain view">
            <img src="https://picsum.photos/id/106/300/200" alt="Lake view">
            <img src="https://picsum.photos/id/1074/300/200" alt="Nature scene">
        </div>
    </main>
    <div id="imageModal" class="modal" hidden>
        <div id="modalContent" class="modal-content">
            <button id="closeModal" class="close-button" type="button" aria-label="Close">×</button>
            <img id="largeImage" src="" alt="Large preview">
        </div>
    </div>
    <script src="q5_image_gallery.js"></script>
</body>
</html>
