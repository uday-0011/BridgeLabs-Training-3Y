<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Dropdown</title>
    <link rel="stylesheet" href="q8_custom_dropdown.css">
</head>
<body>
    <main class="container">
        <h1>Custom Dropdown</h1>
        <div id="dropdown" class="dropdown">
            <button id="dropdownButton" type="button" aria-expanded="false">Choose a course</button>
            <div id="dropdownOptions" class="options" hidden>
                <button type="button" data-value="Java">Java</button>
                <button type="button" data-value="JavaScript">JavaScript</button>
                <button type="button" data-value="Python">Python</button>
                <button type="button" data-value="SQL">SQL</button>
            </div>
        </div>
    </main>
    <script src="q8_custom_dropdown.js"></script>
</body>
</html>
