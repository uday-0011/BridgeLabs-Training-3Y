<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Switcher</title>
    <link rel="stylesheet" href="q4_theme_switcher.css">
</head>
<body data-theme="light">
    <main class="container">
        <h1>Theme Switcher</h1>
        <p>Choose a theme to change the page appearance.</p>
        <button type="button" data-theme-choice="light">Light</button>
        <button type="button" data-theme-choice="dark">Dark</button>
        <button type="button" data-theme-choice="blue">Blue</button>
        <p id="currentTheme">Current theme: Light</p>
    </main>
    <script src="q4_theme_switcher.js"></script>
</body>
</html>
