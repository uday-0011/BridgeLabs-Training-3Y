<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tooltip Demonstration</title>
  <link rel="stylesheet" href="style2.css">
</head>
<body>
  <header><h1>Tooltip Playground</h1><p>Hover over each word to reveal its tooltip.</p></header>
  <main class="tooltip-area">
    <div class="tooltip-item"><span class="symbol">ⓘ</span><span class="tooltip">Helpful information appears here.</span><p>Information</p></div>
    <div class="tooltip-item"><span class="symbol">★</span><span class="tooltip">A star can mark a favourite item.</span><p>Favourite</p></div>
    <div class="tooltip-item"><span class="symbol">☁</span><span class="tooltip">Your files can be stored online.</span><p>Cloud</p></div>
    <div class="tooltip-item"><span class="symbol">✉</span><span class="tooltip">Send a message to someone.</span><p>Message</p></div>
  </main>
  <footer><p>Assignment 8 · Question 2</p></footer>
</body>
</html>
