<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Styled Button Collection</title>
  <link rel="stylesheet" href="style5.css">
</head>
<body>
  <header><h1>Button Collection</h1><p>Hover, focus, press, and compare the buttons.</p></header>
  <main>
    <section class="button-card" aria-label="Button examples">
      <button class="btn primary">Primary</button>
      <button class="btn secondary">Secondary</button>
      <button class="btn outline">Outline</button>
      <button class="btn focus-demo">Focus me</button>
      <button class="btn" disabled>Disabled</button>
    </section>
    <p class="hint">Tip: use Tab to move focus between enabled buttons. The disabled button cannot be activated.</p>
  </main>
  <footer><p>Assignment 8 · Question 5</p></footer>
</body>
</html>
