<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini User Interface</title>
  <link rel="stylesheet" href="style10.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#">BrightDesk</a>
    <nav aria-label="Main navigation"><a href="#features">Features</a><a href="#contact">Contact</a></nav>
  </header>
  <main>
    <section class="main-card" id="features">
      <div class="card-intro">
        <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=700&q=80" alt="Laptop on a desk">
        <div><p class="eyebrow">STAY ORGANIZED</p><h1>Make room for great work.</h1><p>Join a community of learners who plan better, focus deeply, and make progress every day.</p></div>
      </div>
      <form id="contact" action="#" method="get">
        <label for="name">Your name</label><input id="name" name="name" type="text" placeholder="Enter your name" required>
        <label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" required>
        <div class="form-actions"><button class="primary" type="submit">Get started</button><button class="secondary" type="reset">Reset form</button></div>
      </form>
    </section>
  </main>
  <footer><p>© 2026 BrightDesk · Assignment 8, Question 10</p></footer>
</body>
</html>
