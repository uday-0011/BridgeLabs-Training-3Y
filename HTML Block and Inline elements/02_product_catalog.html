<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>
<body>
    <h1>Online Store Product Catalog</h1>

    <!-- Product table -->
    <table border="1">
        <tr>
            <th colspan="5">Product Catalog</th>
        </tr>
        <tr>
            <th>Product Image</th>
            <th>Product Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>
        <tr>
            <td><img src="https://pin.it/6vXwSXqKB" alt="Laptop" width="100"></td>
            <td>Laptop</td>
            <td>Lightweight laptop for everyday use.</td>
            <td>₹55,000</td>
            <td rowspan="2">In Stock</td>
        </tr>
        <tr>
            <td><img src="https://pin.it/RCoiJOHnc" alt="Headphones" width="100"></td>
            <td>Headphones</td>
            <td>Wireless headphones with clear sound.</td>
            <td>₹2,500</td>
        </tr>
        <tr>
            <td><img src="https://pin.it/7oMemFRGQ" alt="Keyboard" width="100"></td>
            <td>Keyboard</td>
            <td>Mechanical keyboard for comfortable typing.</td>
            <td>₹3,000</td>
            <td>Limited Stock</td>
        </tr>
    </table>
</body>
</html>
