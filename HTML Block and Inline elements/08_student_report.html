<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>
    <h1>ABC Senior Secondary School</h1>

    <table border="1" title="Student marks report">
        <caption>Student Academic Report</caption>
        <tr>
            <th rowspan="2">Subject</th>
            <th colspan="2">Marks</th>
        </tr>
        <tr>
            <th>Maximum</th>
            <th>Obtained</th>
        </tr>
        <tr><td>Mathematics</td><td>100</td><td>88</td></tr>
        <tr><td>Science</td><td>100</td><td>82</td></tr>
        <tr><td>English</td><td>100</td><td>90</td></tr>
        <tr><td>Computer Science</td><td>100</td><td>95</td></tr>
        <tr><td>Social Science</td><td>100</td><td>85</td></tr>
        <tr>
            <th colspan="2" title="Total marks obtained">Total</th>
            <td>440 / 500</td>
        </tr>
        <tr>
            <th colspan="2" title="Overall percentage">Percentage</th>
            <td>88%</td>
        </tr>
    </table>
</body>
</html>
