<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conference Schedule</title>
</head>
<body>
    <header>
        <h1>Technology Conference 2026</h1>
    </header>

    <table border="1">
        <caption>Conference Schedule</caption>

        <thead>
            <tr>
                <th>Session</th>
                <th>Time</th>
                <th>Topic</th>
                <th>Speaker</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="2">Morning</td>
                <td>09:00 AM</td>
                <td>Artificial Intelligence</td>
                <td>Dr. Mehta</td>
            </tr>
            <tr>
                <td>10:30 AM</td>
                <td>Cloud Computing</td>
                <td>Ms. Kapoor</td>
            </tr>
            <tr>
                <td>Afternoon</td>
                <td>02:00 PM</td>
                <td>Cyber Security</td>
                <td>Mr. Rao</td>
            </tr>
            <tr>
                <td>Evening</td>
                <td>05:00 PM</td>
                <td>Future of Technology</td>
                <td>Dr. Sharma</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="4">Conference ends at 6:30 PM</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
