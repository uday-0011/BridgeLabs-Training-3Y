<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style7.css">
</head>
<body class="bg-light">
  <header class="bg-primary text-white py-4"><div class="container d-flex flex-column flex-sm-row justify-content-between gap-2 align-items-sm-center"><div><p class="small text-white-50 mb-1">MY WORKSPACE</p><h1 class="h2 mb-0">Task Tracker</h1></div><span class="badge text-bg-light text-primary fs-6">Today</span></div></header>
  <main class="container py-5">
    <section class="tracker-panel p-3 p-md-4 bg-white rounded-4">
      <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h4 mb-0">My tasks</h2><span class="badge text-bg-secondary">3 pending</span></div>
      <!-- Bootstrap list-group organizes individual tasks -->
      <ul class="list-group list-group-flush">
        <li class="list-group-item d-flex flex-column flex-sm-row justify-content-between gap-2 py-3"><span>Prepare project outline</span><span class="d-flex gap-2 align-items-center"><span class="badge text-bg-danger">High</span><span class="badge text-bg-warning">Pending</span></span></li>
        <li class="list-group-item d-flex flex-column flex-sm-row justify-content-between gap-2 py-3"><span>Review dashboard feedback</span><span class="d-flex gap-2 align-items-center"><span class="badge text-bg-warning">Medium</span><span class="badge text-bg-warning">Pending</span></span></li>
        <li class="list-group-item d-flex flex-column flex-sm-row justify-content-between gap-2 py-3"><span>Send meeting notes</span><span class="d-flex gap-2 align-items-center"><span class="badge text-bg-success">Low</span><span class="badge text-bg-warning">Pending</span></span></li>
        <li class="list-group-item d-flex flex-column flex-sm-row justify-content-between gap-2 py-3"><span class="text-decoration-line-through text-secondary">Update team calendar</span><span class="badge text-bg-success">Completed</span></li>
      </ul>
      <div class="mt-4 d-flex flex-column flex-sm-row justify-content-between gap-3 align-items-sm-center"><p class="text-secondary mb-0">Keep your priorities clear and manageable.</p><button type="button" class="btn btn-primary" disabled>Mark selected complete</button></div>
    </section>
  </main>
  <footer class="text-center text-secondary py-4">© 2026 Task Tracker</footer>
</body>
</html>
