<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="Q8_Filter_Comparison_Layout.css">
</head>
<body>
  <!-- Filter Comparison Layout: semantic HTML structure -->
  <header class="header"><p class="eyebrow">A FILTER STUDY</p><h1>One scene, two moods</h1><p>Compare the original image with a filtered version.</p></header>
<main><section class="comparison"><figure class="image-card"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=85" alt="Lake surrounded by mountains in natural colours"><figcaption><strong>Before</strong><span>Original colours</span></figcaption></figure><figure class="image-card"><img class="filtered" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=85" alt="Same mountain lake with increased contrast"><figcaption><strong>After</strong><span>High contrast</span></figcaption></figure></section><p class="hint">Hover over the right image to reveal its original appearance.</p></main>
<footer>CSS filters can change the mood without editing the source image.</footer>
</body>
</html>
