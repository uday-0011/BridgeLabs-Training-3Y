<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="Q1_Responsive_Image_Filter_Gallery.css">
</head>
<body>
  <!-- Responsive Image Filter Gallery: semantic HTML structure -->
  <header class="site-header"><p class="eyebrow">CSS LAB · 01</p><h1>Image Filter Gallery</h1><p>Explore how CSS filters change the mood of an image.</p></header>
<main class="gallery-wrap"><section class="gallery" aria-label="Filtered image gallery">
<figure class="filter-card"><img class="blur" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Mountain lake"><figcaption>Blur</figcaption></figure>
<figure class="filter-card"><img class="grayscale" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=80" alt="Sunrise over hills"><figcaption>Grayscale</figcaption></figure>
<figure class="filter-card"><img class="sepia" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Hiker in a landscape"><figcaption>Sepia</figcaption></figure>
<figure class="filter-card"><img class="brightness" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="Lake and mountains"><figcaption>Brightness</figcaption></figure>
<figure class="filter-card"><img class="contrast" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80" alt="Snowy mountain peaks"><figcaption>Contrast</figcaption></figure>
<figure class="filter-card"><img class="hue" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Sunlight through a forest"><figcaption>Hue rotate</figcaption></figure>
</section></main><footer>Hover over an image to remove its filter.</footer>
</body>
</html>
